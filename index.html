function board(S){S=S||G.scores;const m=Math.max(...G.scores);return S.map((s,i)=>`<div class=team style="background:${TC[i]}"><span>${TN[i]} <small>(${P.filter(p=>p.team===i).length})</small></span><span><span id=tl${i}>${s}</span>${G.phase=="done"&&G.scores[i]==m?" 🏆":""}</span></div>`).join("")}
const roster=()=>`<div class=card><b>Players</b><div>${P.map(p=>`<span class=chip>${esc(p.name)}${p.team!=null?" · "+TN[p.team]:""}${G.phase=="write"?((p.qs||[]).length>=G.qn?" ✅":" ✍️ "+(p.qs||[]).length+"/"+G.qn):""} <a href="#" onclick="kick('${p.id}');return false" style="color:var(--ac);text-decoration:none">✕</a></span>`).join("")||'<span class=mut>Waiting for players…</span>'}</div></div>`;
const doneCard=()=>`<div class="card c"><h2>Battle over!</h2>${G.scores.some(s=>s>=G.target)?"<div class=mut>First to "+G.target+" points!</div>":""}${G.scores.map((s,i)=>s==Math.max(...G.scores)?TN[i]+" team wins! 🏆":"").filter(Boolean).join("<br>")}</div>`;
const fear=h=>`<div class="fear c"><div class=face>😨</div>${h}</div>`,stage=()=>`<div class=stage id=stg><div id=qq></div><div id=aa></div><div class=shade></div><div class=black></div><div class=flash></div><div class="cu l"></div><div class="cu r"></div></div><div class=card>${board(G.prev)}</div><div id=fin class="c mut">🥁 Results are coming…</div>`;
const wheelhtml=()=>`<div class=c><h2>🎡 Bonus round!</h2><div style="position:relative;width:272px;height:272px;margin:0 auto"><div style="position:absolute;top:-16px;left:50%;margin-left:-14px;font-size:30px;z-index:2">▼</div><div id=wh class=wheel>${MG.map((m,i)=>`<div class=wl style="transform:rotate(${i*120+60}deg) translateY(-85px)">${m[0]}<br><small>${m[1]}</small></div>`).join("")}</div></div><div id=wr class=mut style="margin-top:12px">Spinning…</div></div>`;
const minihtml=()=>`<div class="card c"><h2>${MG[G.mg][0]} ${MG[G.mg][1]}</h2><div class=mut>${MG[G.mg][2]}</div><div id=mg></div></div>`,miniResCard=()=>`<div class=card><h2>${MG[G.mg][0]} Team averages</h2>${G.mres.avg.map((a,t)=>`<div class=team style="background:${TC[t]}"><span>${TN[t]}</span><span>${a}${G.mres.bonus[t]?" · +2 🎁":""}</span></div>`).join("")}</div>`;
function fx(){const d=document.createElement("div");d.className="fxo";d.innerHTML="<span class=sl>🗡️</span><span class=sr>🗡️</span><span class=sp>💥</span>";document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function boom(n){const s=$("#stg");if(!s)return;for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*.6}s`;s.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function drum(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;for(let i=0;i<28;i++){const o=AC.createOscillator(),g=AC.createGain(),a=t+i*.055;o.type="triangle";o.frequency.value=90+i*2;g.gain.setValueAtTime(.05+i*.012,a);g.gain.exponentialRampToValueAtTime(.001,a+.05);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+.06)}}catch(e){}}
async function play(){const my=++tok,s=$("#stg");if(!s)return;const sc=[...G.prev],stop=()=>my!==tok||!$("#stg"),set=c=>{s.className="stage "+c},qq=$("#qq"),aa=$("#aa");
for(const r of G.rv){if(stop())return;set("");qq.innerHTML=`<div class=mut>✍️ ${esc(r.by)} (${TN[r.bt]}) asks</div><b>${esc(r.text)}</b>`;aa.innerHTML="";await sleep(400);if(stop())return;set("open");await sleep(2600);if(stop())return;
drum();set("open spot");aa.innerHTML=`<div class=mut>🎯 ${esc(r.to)} (${TN[r.tt]}) answered</div><b>${esc(r.ans)}</b>`;await sleep(1800);if(stop())return;set("open dark");await sleep(700);if(stop())return;
if(r.right){set("open green");boom(45);sc[r.tt]++;aa.innerHTML=`<b>✅ Correct! +1 ${TN[r.tt]}</b>`}else{set("open red");aa.innerHTML=`<b>❌ Wrong</b><div class=mut>Answer: ${esc(r.cor)}</div>`}
const e=$("#tl"+r.tt);if(e)e.textContent=sc[r.tt];await sleep(2400);if(stop())return;set("");await sleep(1100)}
if(stop())return;const b=$("#cb");if(b)b.disabled=false;const f=$("#fin");if(f)f.textContent="Round complete!"}
function skipRv(){tok++;G.scores.forEach((s,i)=>{const e=$("#tl"+i);if(e)e.textContent=s});const s=$("#stg");if(s)s.className="stage";const b=$("#cb");if(b)b.disabled=false;const f=$("#fin");if(f)f.textContent="Round complete!"}
function spin(){const w=$("#wh");if(!w)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transform=`rotate(${1800-(G.mg*120+60)}deg)`}));setTimeout(()=>{const r=$("#wr");if(r)r.innerHTML=`<b>${MG[G.mg][0]} ${MG[G.mg][1]}!</b>`},5200)}
function mini(){const el=$("#mg");if(!el)return;const g=G.mg,n=G.mn,tm=(P.find(p=>p.id===uid)||{}).team||0,live=()=>$("#mg")===el&&G&&G.mn===n&&G.phase=="mini",done=sc=>{if(!live())return;sc=Math.round(sc);pref().update({ms:sc,mr:n});el.innerHTML=`<p>Your score: <b>${sc}</b><br>Waiting for others…</p>`};
if(g==0){let c=0,t=10;el.innerHTML=`<div class=mut id=mt>10s</div><button id=bb style="width:150px;height:150px;border-radius:50%;font-size:60px;background:${TC[tm]}">⚽</button><div id=mc style="font-size:30px">0</div>`;const b=$("#bb");b.onclick=()=>{c++;$("#mc").textContent=c;b.animate([{transform:"scale(.85)"},{transform:"scale(1)"}],120)};const iv=setInterval(()=>{if(!live())return clearInterval(iv);t--;$("#mt").textContent=t+"s";if(t<=0){clearInterval(iv);done(c)}},1000)}
else if(g==1){const v=B[G.mv][1];el.innerHTML=`<p><i>${esc(v)}</i></p><div class=mut>Memorize it! Hiding in 6s…</div>`;setTimeout(()=>{if(!live())return;el.innerHTML=`<textarea id=vt rows=4 placeholder="Type the verse from memory"></textarea><div class=mut id=mt>25s</div><button id=vb>Done</button>`;let t=25,d=0;const fin=()=>{if(d||!live())return;d=1;const a=norm($("#vt").value),b=norm(v);let m=0;for(let i=0;i<b.length;i++)if(a[i]===b[i])m++;const acc=m/b.length*100;done(acc+(acc>=90?t:0))};$("#vb").onclick=fin;const iv=setInterval(()=>{if(d||!live())return clearInterval(iv);t--;$("#mt").textContent=t+"s";if(t<=0){clearInterval(iv);fin()}},1000)},6000)}
else{let k=0,tot=0;const rd=()=>{if(!live())return;el.innerHTML=`<button id=qd style="height:160px;background:#555">Wait…</button><div class=mut>Try ${k+1}/3</div>`;const b=$("#qd");let t0=0,gr=0;const to=setTimeout(()=>{if(!live())return;gr=1;t0=Date.now();b.style.background="#2f9e5b";b.textContent="TAP!"},1500+Math.random()*3500);b.onclick=()=>{clearTimeout(to);tot+=gr?Math.max(0,1000-(Date.now()-t0)):0;if(++k>=3)done(tot/3);else setTimeout(rd,600)}};rd()}}
function qhtml(q,mine,show,pick){const body=q.t=="txt"?(show?`<p>✅ Accepted: <b>${q.acc.map(esc).join(" / ")}</b></p>`+(mine!==-1?`<p class=mut>Your answer: ${esc(mine)}</p>`:""):pick?`<input id=ta placeholder="Type your answer" autocomplete=off><button onclick="ansT()">Lock in answer</button>`:mine!==-1?`<p class=mut>Locked in: ${esc(mine)}</p>`:""):q.o.map((o,i)=>`<button class="opt ${show&&i===q.c?"ok":""} ${mine===i?"me":""}" ${pick?`onclick="ans(${i})"`:"disabled"}>${"ABCD"[i]}. ${esc(o)}</button>`).join("");return `<div class=card><b>${esc(q.text)}</b>${q.ref?`<div class=mut>Related: ${esc(q.ref)}</div>`:""}${body}${show&&q.vt?`<p class=mut>📖 ${esc(q.ref)} — ${esc(q.vt)}</p>`:""}</div>`}
const ans=i=>pref().update({a:i,ar:G.round});
function blist(q,pick){q=norm(q);let last="";return B.map((v,i)=>[v,i]).filter(([v])=>norm(v[0]+v[1]).includes(q)).map(([v,i])=>{const b=v[0].replace(/\s\d+:\d+$/,""),hd=b!==last?`<div class=bh>${b}</div>`:"";last=b;return hd+`<div class=v><b>${v[0].slice(b.length+1)}</b> ${esc(v[1])}${pick?`<button onclick="use(${i})">Use</button>`:""}</div>`}).join("")||"No match"}
const bl=(q,p)=>{bq=q;$("#bl").innerHTML=blist(q,p)};
function bhtml(pick){return `<button class=g onclick="closeB()">← Back</button><div class=card><b>📖 Bible (KJV)</b><input placeholder="Search a word or reference" value="${esc(bq)}" oninput="bl(this.value,${pick})"><div id=bl>${blist(bq,pick)}</div><button class=g onclick="closeB()">← Back</button></div>`}
function use(i){draft.ref=B[i][0];draft.vt=B[i][1];bible=false;go(1)}
function form(tm,k){const d=draft,m=(t,l)=>`<button class="${d.t==t?"":"g"}" onclick="draft.t='${t}';draft.c=0;go(1)">${l}</button>`;return `<div class=card><b>Write your question for the ${TN[((tm||0)+1)%G.teams]} team <span class=mut>(${k} of ${G.qn})</span></b><div class=row>${m("mc","4 choices")}${m("tf","True/False")}${m("txt","Typed")}</div>
<textarea rows=3 placeholder="${d.t=="tf"?"Write a statement":"Write a question"}" oninput="draft.q=this.value">${esc(d.q)}</textarea>
${d.t=="mc"?d.o.map((o,i)=>`<input placeholder="Choice ${"ABCD"[i]}" value="${esc(o)}" oninput="draft.o[${i}]=this.value">`).join(""):""}
${d.t=="txt"?`<input placeholder="Accepted answers, separated by commas (e.g. 2 Corinthians, 2 Cor)" value="${esc(d.acc)}" oninput="draft.acc=this.value"><div class=mut>Capitals, spaces and punctuation don't matter, and short forms like "2cor" count.</div>`:`<label>Correct answer</label><select onchange="draft.c=+this.value">${(d.t=="tf"?["True","False"]:["A","B","C","D"]).map((o,i)=>`<option value=${i} ${d.c===i?"selected":""}>${o}</option>`).join("")}</select>`}
<div class=mut>${d.ref?"Verse attached: "+esc(d.ref):"Tip: attach a verse from the Bible"}</div><button class=g onclick="bible=true;go(1)">📖 Open Bible & attach verse</button><button onclick="submitQ()">Send to battle ⚔️</button></div>`}
function submitQ(){const d=draft,acc=d.acc.split(/[,;]/).map(x=>x.trim()).filter(Boolean),o=d.t=="tf"?["True","False"]:d.t=="txt"?[]:d.o.map(x=>x.trim());if(!d.q.trim()||o.some(x=>!x)||(d.t=="txt"&&!acc.length))return alert("Fill in the question and the answer(s)");if(hc&&hc.open)hc.send({t:"q",uid,q:{t:d.t,text:d.q.trim(),o,c:d.c,acc,ref:d.ref,vt:d.vt}});draft=nd();fx();go(1)}
function go(force){if(!G){if(code)app.innerHTML=hdr+'<div class="card c">Loading game…</div>';return}logic();const me=P.find(p=>p.id===uid)||{},ph=G.phase,spec=["review","wheel","minires","mini"].includes(ph),qc=P.reduce((a,p)=>a+(p.qs||[]).length,0);
if(isHost&&ph=="write"&&qc>lastQ)fx();lastQ=ph=="write"?qc:0;
const key=(spec?[ph,G.rn,G.mn,bible,me.mr===G.mn,isHost&&ph=="mini"?P.filter(p=>p.mr===G.mn).length:0]:[ph,G.round,me.team,(me.qs||[]).length,me.ar===G.round,bible,isHost?P.length+"|"+qc+"|"+P.filter(p=>p.ar===G.round).length+JSON.stringify(G.scores):P.length]).join();if(!force&&key===lastKey)return;lastKey=key;
if(bible){app.innerHTML=hdr+bhtml(!isHost&&me.team!=null&&ph=="write"&&(me.qs||[]).length<G.qn);return}
const top=`${ph=="mini"?"":bk}${hdr}<div class="card c mut">Code <b style="color:var(--ac);letter-spacing:3px">${code}</b>${ph=="answer"?` · Round ${(G.rn||0)+1} · Q ${G.qi}/${G.total}`:""}<br>First to <b>${G.target}</b> points wins</div>`,c=G.cur;let h="";
if(isHost){if(ph=="lobby")h=`<div class=card><div class=c>Open this site on your device and enter code</div><div class=code>${code}</div></div>`+roster()+`<button ${P.length<G.teams?"disabled":""} onclick="start()">Split into ${G.teams} teams</button><button class=g onclick="hback()">← Back</button>`;
else if(ph=="write"){const n=P.filter(p=>(p.qs||[]).length>=G.qn).length;h=`<div class=card>${board()}</div><div class="card c">Everyone writes ${G.qn} question${G.qn>1?"s":""} for another team.${G.rn?"<br>Nobody has won yet, so here comes another batch!":""}<br><b>${n}/${P.length}</b> finished<button ${P.some(p=>p.qs&&p.qs.length)?"":"disabled"} onclick="begin()">${n==P.length?"Start battle ⚔️":"Start anyway"}</button></div>`+roster()}
else if(ph=="answer")h=`<div class=card>${board()}</div>`+fear(qhtml(c.q,-1,false,false))+`<div class="card c">😨 …staring at ${esc(c.toName)} (${TN[c.toTeam]}), who must answer ${esc(c.by)}'s question<button onclick="record()">Skip / time's up</button></div>`;
else if(ph=="review")h=stage()+`<button id=cb disabled onclick="cont()">Continue</button><button class=g onclick="skipRv()">Skip animation</button>`;
else if(ph=="wheel")h=wheelhtml();
else if(ph=="mini")h=`<div class="card c"><h2>${MG[G.mg][0]} ${MG[G.mg][1]}</h2>Players are playing… ${P.filter(p=>p.mr===G.mn).length}/${P.length} done<button onclick="finishMini()">Finish now</button></div>`;
else if(ph=="minires")h=miniResCard()+`<div class=card>${board()}</div><button onclick="cont()">Continue</button><button class=g onclick="gref().update({phase:'done'})">End game now</button>`;
else h=doneCard()+`<div class=card>${board()}</div><button class=g onclick="home()">New game</button>`}
else{const tm=me.team;h=tm==null?"":`<div class=team style="background:${TC[tm]}"><span>You're on ${TN[tm]} team</span><span>${G.scores[tm]} pts</span></div>`;
if(ph=="lobby")h=`<div class="card c"><h2>You're in, ${esc(me.name||"")}!</h2>${P.length} player${P.length==1?"":"s"} here. Waiting for the host to start…</div><button class=g onclick="home()">Leave game</button>`;
if(ph=="write")h+=(me.qs||[]).length>=G.qn?'<div class="card c">All your questions are in! Waiting for everyone else…</div>':form(tm,(me.qs||[]).length+1);
if(ph=="answer")h+=c.to===uid?fear(qhtml(c.q,me.ar===G.round?me.a:-1,false,me.ar!==G.round)):fear(qhtml(c.q,-1,false,false))+`<div class="card c">${esc(c.toName)} (${TN[c.toTeam]}) is answering…</div>`;
if(ph=="review")h+=stage();if(ph=="wheel")h=wheelhtml();
if(ph=="mini")h+=me.mr===G.mn?`<div class="card c">Score locked in: <b>${me.ms}</b><br>Waiting for others…</div>`:minihtml();
if(ph=="minires")h+=miniResCard()+`<div class=card>${board()}</div>`;
if(ph=="done")h+=`<div class=card>${board()}</div>`+doneCard()}
app.innerHTML=top+h;if(ph=="review")play();if(ph=="wheel")spin();if(ph=="mini"&&!isHost&&me.mr!==G.mn)mini()}
</script></body></html>
