<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bible Battle</title>
<style>
:root{--bg:#fff7ec;--fg:#2b1d12;--card:#fff;--ac:#7a1f1f;--on:#fff;--mut:#8a7765;--bd:#e6d6c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--fg:#f4e9da;--card:#2a201a;--ac:#e0a458;--on:#1c1511;--mut:#a89580;--bd:#44352a}}
:root[data-theme="dark"]{--bg:#1c1511;--fg:#f4e9da;--card:#2a201a;--ac:#e0a458;--on:#1c1511;--mut:#a89580;--bd:#44352a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 Georgia,"Times New Roman",serif;min-height:100%}
#app{max-width:560px;margin:0 auto;padding:16px}h1{text-align:center;margin:8px 0}h1 small{display:block;font-size:14px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 16px;margin:4px 0;width:100%;font-weight:700;cursor:pointer}button.g{background:none;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.4}
.code{font-size:52px;letter-spacing:8px;text-align:center;font-weight:800;color:var(--ac)}.row{display:flex;gap:8px}.row>*{flex:1}
.team{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;color:#fff;margin:5px 0;font-weight:700}
.chip{display:inline-block;padding:4px 10px;margin:3px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.opt{background:var(--card);color:var(--fg);border:2px solid var(--bd);text-align:left}.opt.ok{border-color:#2f9e5b;background:#2f9e5b33}.opt.me{border-color:var(--ac)}
.v{padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}.v button{width:auto;padding:4px 12px;margin-left:6px}#bl{max-height:45vh;overflow-y:auto}.mut{color:var(--mut)}.c{text-align:center}.bh{margin:12px 0 2px;color:var(--ac);font-weight:700}.bk{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;z-index:9}
</style></head><body><div id="app"><p class="c">Loading…</p></div>
<script>
const B=[["Genesis 1:1","In the beginning God created the heaven and the earth."],["Genesis 1:27","So God created man in his own image, in the image of God created he him; male and female created he them."],["Exodus 20:3","Thou shalt have no other gods before me."],["Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."],["Psalm 23:1","The LORD is my shepherd; I shall not want."],["Psalm 23:4","Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me."],["Psalm 46:1","God is our refuge and strength, a very present help in trouble."],["Psalm 119:105","Thy word is a lamp unto my feet, and a light unto my path."],["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."],["Proverbs 3:6","In all thy ways acknowledge him, and he shall direct thy paths."],["Isaiah 40:31","But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."],["Isaiah 53:5","But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."],["Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end."],["Micah 6:8","He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"],["Matthew 5:9","Blessed are the peacemakers: for they shall be called the children of God."],["Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."],["Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest."],["Matthew 28:19","Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"],["Mark 12:30","And thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength: this is the first commandment."],["Luke 2:11","For unto you is born this day in the city of David a Saviour, which is Christ the Lord."],["John 1:1","In the beginning was the Word, and the Word was with God, and the Word was God."],["John 3:16","For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."],["John 11:35","Jesus wept."],["John 14:6","Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."],["Romans 3:23","For all have sinned, and come short of the glory of God;"],["Romans 6:23","For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."],["Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose."],["Romans 10:9","That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved."],["1 Corinthians 13:13","And now abideth faith, hope, charity, these three; but the greatest of these is charity."],["2 Corinthians 5:17","Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."],["Galatians 5:22","But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,"],["Ephesians 2:8","For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"],["Ephesians 6:11","Put on the whole armour of God, that ye may be able to stand against the wiles of the devil."],["Philippians 4:13","I can do all things through Christ which strengtheneth me."],["2 Timothy 3:16","All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:"],["Hebrews 11:1","Now faith is the substance of things hoped for, the evidence of things not seen."],["James 1:5","If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."],["1 John 4:8","He that loveth not knoweth not God; for God is love."]];
const TN=["Red","Blue","Green","Gold"],TC=["#c0392b","#2e6fd0","#2f9e5b","#b8860b"],$=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db,uid,code,isHost=false,G=null,P=[],unsubs=[],acted="",lastKey="",bible=false,bq="";
const nd=()=>({t:"mc",q:"",o:["","","",""],c:0,acc:"",ref:"",vt:""});let draft=nd();
const gref=()=>db.doc("games/"+code),pref=()=>db.doc("games/"+code+"/players/"+uid);
const hdr='<h1>⚔️ Bible Battle<small>Team vs team · Scripture trivia</small></h1>';
const bk='<button class=bk aria-label=Bible onclick="openB()">📖</button>',openB=()=>{bible=true;G?go(1):home()},closeB=()=>{bible=false;G?go(1):home()};
const norm=s=>String(s).toLowerCase().replace(/\bfirst\b/g,'1').replace(/\bsecond\b/g,'2').replace(/\bthird\b/g,'3').replace(/[^a-z0-9]/g,'');
const ok=(q,a)=>{if(q.t!='txt')return a===q.c;const x=norm(a);return x.length>=3&&q.acc.some(c=>{c=norm(c);return x===c||c.startsWith(x)})};
const ansT=()=>{const v=$('#ta').value.trim();if(v)pref().update({a:v,ar:G.round})};
(async()=>{try{const u=await claude.use("user");db=await claude.use("db");if(!u||!db)throw 0;uid=await u.id();if(!uid)throw 0;home()}catch(e){app.innerHTML=hdr+'<div class="card c">Please open this page signed in to claude.ai (with Contributor access) to play.</div>'}})();
function home(){unsubs.forEach(f=>f());unsubs=[];G=null;P=[];code="";isHost=false;if(bible){app.innerHTML=hdr+bhtml(false);return}app.innerHTML=bk+hdr+`<div class=card><b>Join a game</b><input id=jc placeholder="Game code" maxlength=4 style="text-transform:uppercase;text-align:center;font-size:24px"><input id=jn placeholder="Your name" maxlength=16><button onclick="join()">Join</button></div>
<div class=card><b>Host a game</b><div class=row><div>Teams<select id=ht><option>2<option>3<option>4</select></div><div>Rounds<input id=hr type=number value=6 min=2 max=30></div></div><button class=g onclick="host()">Create game</button></div>`}
async function host(){code=Math.random().toString(36).slice(2,6).toUpperCase();const t=+$("#ht").value,r=Math.max(2,Math.min(30,+$("#hr").value||6));isHost=true;await gref().set({host:uid,teams:t,rounds:r,phase:"lobby",round:0,scores:Array(t).fill(0),q:null});sub()}
async function join(){const c=$("#jc").value.trim().toUpperCase(),n=$("#jn").value.trim();if(c.length<4||!n)return alert("Enter the code and your name");code=c;const s=await gref().get();if(!s.exists)return alert("No game with that code");isHost=false;const m=await pref().get();if(!m.exists)await pref().set({name:n,team:null});sub()}
function sub(){unsubs.push(gref().onSnapshot(s=>{G=s.exists?s.data():null;go()}),db.collection("games/"+code+"/players").onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));go()}))}
const ct=()=>(G.round-1)%G.teams;
function logic(){if(!G||!isHost)return;const k=G.phase+G.round;if(acted===k)return;
if(G.phase=="create"){const q=P.filter(p=>p.team===ct()&&p.qr===G.round&&p.q).sort((a,b)=>a.qt-b.qt)[0];if(q){acted=k;gref().update({phase:"answer",q:q.q,qby:q.name})}}
if(G.phase=="answer"){const a=P.filter(p=>p.team!=null&&p.team!==ct());if(a.length&&a.every(p=>p.ar===G.round))reveal()}}
function reveal(){acted=G.phase+G.round;const sc=[...G.scores],gain=[];for(let t=0;t<G.teams;t++){let r=0,w=0;if(t!==ct())P.filter(p=>p.team===t&&p.ar===G.round).forEach(p=>ok(G.q,p.a)?r++:w++);const g=r>w?1:0;gain.push(g);sc[t]+=g}gref().update({phase:"reveal",scores:sc,gain})}
async function start(){const s=[...P].sort(()=>Math.random()-.5);await Promise.all(s.map((p,i)=>db.doc("games/"+code+"/players/"+p.id).update({team:i%G.teams})));gref().update({phase:"create",round:1,q:null})}
function next(){G.round>=G.rounds?gref().update({phase:"done"}):gref().update({round:G.round+1,phase:"create",q:null})}
function board(){const m=Math.max(...G.scores);return G.scores.map((s,i)=>`<div class=team style="background:${TC[i]}"><span>${TN[i]}${G.phase!="lobby"&&G.phase!="done"&&i===ct()?" ✍️":""} <small>(${P.filter(p=>p.team===i).length})</small></span><span>${s}${G.phase=="done"&&s==m?" 🏆":""}</span></div>`).join("")}
function qhtml(q,mine,show,pick){const body=q.t=="txt"?(show?`<p>✅ Accepted: <b>${q.acc.map(esc).join(" / ")}</b></p>`+(mine!==-1?`<p class=mut>Your answer: ${esc(mine)}</p>`:""):pick?`<input id=ta placeholder="Type your answer" autocomplete=off><button onclick="ansT()">Lock in answer</button>`:mine!==-1?`<p class=mut>Locked in: ${esc(mine)}</p>`:""):q.o.map((o,i)=>`<button class="opt ${show&&i===q.c?"ok":""} ${mine===i?"me":""}" ${pick?`onclick="ans(${i})"`:"disabled"}>${"ABCD"[i]}. ${esc(o)}</button>`).join("");return `<div class=card><b>${esc(q.text)}</b>${q.ref?`<div class=mut>Related: ${esc(q.ref)}</div>`:""}${body}${show&&q.vt?`<p class=mut>📖 ${esc(q.ref)} — ${esc(q.vt)}</p>`:""}</div>`}
const ans=i=>pref().update({a:i,ar:G.round});
function blist(q,pick){q=norm(q);let last="";return B.map((v,i)=>[v,i]).filter(([v])=>norm(v[0]+v[1]).includes(q)).map(([v,i])=>{const b=v[0].replace(/\s\d+:\d+$/,""),hd=b!==last?`<div class=bh>${b}</div>`:"";last=b;return hd+`<div class=v><b>${v[0].slice(b.length+1)}</b> ${esc(v[1])}${pick?`<button onclick="use(${i})">Use</button>`:""}</div>`}).join("")||"No match"}
const bl=(q,p)=>{bq=q;$("#bl").innerHTML=blist(q,p)};
function bhtml(pick){return `<button class=g onclick="closeB()">← Back</button><div class=card><b>📖 Bible (KJV)</b><input placeholder="Search a word or reference" value="${esc(bq)}" oninput="bl(this.value,${pick})"><div id=bl>${blist(bq,pick)}</div><button class=g onclick="closeB()">← Back</button></div>`}
function use(i){draft.ref=B[i][0];draft.vt=B[i][1];bible=false;go(1)}
function form(){const d=draft,m=(t,l)=>`<button class="${d.t==t?"":"g"}" onclick="draft.t='${t}';draft.c=0;go(1)">${l}</button>`;return `<div class=card><b>Write a question for the other team${G.teams>2?"s":""}</b><div class=row>${m("mc","4 choices")}${m("tf","True/False")}${m("txt","Typed")}</div>
<textarea rows=3 placeholder="${d.t=="tf"?"Write a statement":"Write a question"}" oninput="draft.q=this.value">${esc(d.q)}</textarea>
${d.t=="mc"?d.o.map((o,i)=>`<input placeholder="Choice ${"ABCD"[i]}" value="${esc(o)}" oninput="draft.o[${i}]=this.value">`).join(""):""}
${d.t=="txt"?`<input placeholder="Accepted answers, separated by commas (e.g. 2 Corinthians, 2 Cor)" value="${esc(d.acc)}" oninput="draft.acc=this.value"><div class=mut>Capitals, spaces and punctuation don't matter, and short forms like "2cor" count.</div>`:`<label>Correct answer</label><select onchange="draft.c=+this.value">${(d.t=="tf"?["True","False"]:["A","B","C","D"]).map((o,i)=>`<option value=${i} ${d.c===i?"selected":""}>${o}</option>`).join("")}</select>`}
<div class=mut>${d.ref?"Verse attached: "+esc(d.ref):"Tip: attach a verse from the Bible"}</div><button class=g onclick="bible=true;go(1)">📖 Open Bible & attach verse</button><button onclick="submitQ()">Send to battle ⚔️</button></div>`}
function submitQ(){const d=draft,acc=d.acc.split(/[,;]/).map(x=>x.trim()).filter(Boolean),o=d.t=="tf"?["True","False"]:d.t=="txt"?[]:d.o.map(x=>x.trim());if(!d.q.trim()||o.some(x=>!x)||(d.t=="txt"&&!acc.length))return alert("Fill in the question and the answer(s)");pref().update({qr:G.round,qt:Date.now(),q:{t:d.t,text:d.q.trim(),o,c:d.c,acc,ref:d.ref,vt:d.vt}});draft=nd()}
function go(force){if(!G){if(code)app.innerHTML=hdr+'<div class="card c">Loading game…</div>';return}logic();const me=P.find(p=>p.id===uid)||{};
const key=[G.phase,G.round,me.team,me.qr===G.round,me.ar===G.round,bible,isHost?P.length+JSON.stringify(G.scores):P.length].join();if(!force&&key===lastKey)return;lastKey=key;
if(bible){app.innerHTML=hdr+bhtml(!isHost&&me.team!=null&&G.phase=="create"&&me.team===ct()&&me.qr!==G.round);return}const top=`${bk}${hdr}<div class="card c mut">Code <b style="color:var(--ac);letter-spacing:3px">${code}</b>${G.round?` · Round ${G.round}/${G.rounds}`:""}</div>`;let h="";
if(isHost){if(G.phase=="lobby")h=`<div class=card><div class=c>Join at this page with code</div><div class=code>${code}</div><div>${P.map(p=>`<span class=chip>${esc(p.name)}</span>`).join("")||'<span class=mut>Waiting for players…</span>'}</div><button ${P.length<G.teams?"disabled":""} onclick="start()">Split into ${G.teams} teams & start</button></div>`;
else{h=`<div class=card>${board()}</div>`;if(G.phase=="create")h+=`<div class="card c">${TN[ct()]} team is writing a question…<button class=g onclick="next()">Skip this round</button></div>`;
if(G.phase=="answer"){const a=P.filter(p=>p.team!=null&&p.team!==ct());h+=qhtml(G.q,-1,false,false)+`<div class="card c">Written by ${esc(G.qby)} (${TN[ct()]}) · ${a.filter(p=>p.ar===G.round).length}/${a.length} answered<button onclick="reveal()">Reveal answer</button></div>`}
if(G.phase=="reveal")h+=qhtml(G.q,-1,true,false)+`<div class="card c">${G.gain.map((g,i)=>g?`<span class=chip style="background:${TC[i]};color:#fff">${TN[i]} +1</span>`:"").join("")||"No points this round"}<button onclick="next()">${G.round>=G.rounds?"Final results":"Next round"}</button></div>`;
if(G.phase=="done")h+=`<div class="card c"><h2>Battle over!</h2>${G.scores.map((s,i)=>s==Math.max(...G.scores)?TN[i]+" team wins! 🏆":"").join("<br>")}<button class=g onclick="home()">New game</button></div>`}}
else if(bible)h=bhtml(me.team!=null&&G.phase=="create"&&me.team===ct());
else{const tm=me.team,t=tm==null?"":`<div class=team style="background:${TC[tm]}"><span>You're on ${TN[tm]} team</span><span>${G.scores[tm]} pts</span></div>`;
if(G.phase=="lobby")h=`<div class="card c"><h2>You're in, ${esc(me.name||"")}!</h2>${P.length} player${P.length==1?"":"s"} here. Waiting for the host to start…</div>`;
else{h=t;const mine=tm===ct();
if(G.phase=="create")h+=mine?(me.qr===G.round?'<div class="card c">Question sent! Waiting for the battle…</div>':form()):`<div class="card c">${TN[ct()]} team is writing a question.<br>Get ready!</div><button class=g onclick="bible=true;go(1)">📖 Open Bible</button>`;
if(G.phase=="answer")h+=mine?'<div class="card c">Your question is live! The other team is answering…</div>':qhtml(G.q,me.ar===G.round?me.a:-1,false,me.ar!==G.round)+`<button class=g onclick="bible=true;go(1)">📖 Open Bible</button>`;
if(G.phase=="reveal")h+=qhtml(G.q,me.ar===G.round?me.a:-1,true,false)+`<div class="card c">${G.gain[tm]?"Your team scored! +1":"No point for your team"}</div><div class=card>${board()}</div>`;
if(G.phase=="done")h+=`<div class=card>${board()}</div><div class="card c"><h2>Battle over!</h2></div>`}}
app.innerHTML=top+h}
</script></body></html>
